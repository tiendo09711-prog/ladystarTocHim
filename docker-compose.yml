services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: nam_hair
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - nam_hair_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  nam_hair_mysql:
